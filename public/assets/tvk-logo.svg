<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- Black background -->
  <rect width="400" height="480" fill="#000000"/>

  <!-- FLAG POLE -->
  <line x1="200" y1="60" x2="180" y2="280" stroke="#888" stroke-width="5" stroke-linecap="round"/>

  <!-- TVK FLAG - Red top stripe -->
  <polygon points="200,60 340,80 340,130 200,110" fill="#CC0000"/>
  <!-- TVK FLAG - Yellow middle stripe -->
  <polygon points="200,110 340,130 340,175 200,155" fill="#FFD700"/>
  <!-- TVK FLAG - Red bottom stripe -->
  <polygon points="200,155 340,175 340,220 200,200" fill="#CC0000"/>

  <!-- Elephant on yellow stripe (simplified) -->
  <ellipse cx="285" cy="152" rx="22" ry="14" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="273" cy="148" rx="12" ry="10" fill="#ffffff" opacity="0.9"/>
  <!-- Elephant trunk -->
  <path d="M266,152 Q258,165 262,172" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Elephant legs -->
  <rect x="275" y="160" width="5" height="12" rx="2" fill="#ffffff" opacity="0.8"/>
  <rect x="283" y="160" width="5" height="12" rx="2" fill="#ffffff" opacity="0.8"/>
  <rect x="291" y="160" width="5" height="12" rx="2" fill="#ffffff" opacity="0.8"/>

  <!-- Rising sun / lotus on red stripe (center symbol) -->
  <circle cx="270" cy="105" r="14" fill="#FFD700" opacity="0.85"/>
  <circle cx="270" cy="105" r="9" fill="#CC0000" opacity="0.9"/>

  <!-- PERSON - Body (white shirt) -->
  <ellipse cx="195" cy="350" rx="45" ry="65" fill="#e8e8e8"/>
  <!-- Shirt collar -->
  <path d="M180,295 L195,320 L210,295" fill="#ffffff" stroke="#ccc" stroke-width="1"/>

  <!-- PERSON - Head -->
  <ellipse cx="195" cy="265" rx="32" ry="36" fill="#c8956c"/>
  <!-- Hair -->
  <ellipse cx="195" cy="245" rx="32" ry="18" fill="#1a1a1a"/>
  <!-- Face features - eyes -->
  <ellipse cx="185" cy="268" rx="4" ry="4.5" fill="#1a1a1a"/>
  <ellipse cx="205" cy="268" rx="4" ry="4.5" fill="#1a1a1a"/>
  <!-- Smile -->
  <path d="M183,282 Q195,292 207,282" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Beard -->
  <path d="M175,278 Q195,300 215,278" fill="#1a1a1a" opacity="0.6"/>
  <!-- Eyebrows -->
  <path d="M180,260 Q185,256 190,260" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <path d="M200,260 Q205,256 210,260" stroke="#1a1a1a" stroke-width="2" fill="none"/>

  <!-- Right arm raised holding flag -->
  <path d="M215,300 Q240,250 200,195" stroke="#c8956c" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Hand -->
  <circle cx="200" cy="190" r="12" fill="#c8956c"/>

  <!-- Left arm -->
  <path d="M175,310 Q145,340 150,370" stroke="#e8e8e8" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Bracelet on right wrist -->
  <path d="M205,205 Q200,200 195,205" stroke="#FFD700" stroke-width="3" fill="none"/>

  <!-- TAMIL TEXT - தமிழக வெற்றிக் கழகம் -->
  <text x="200" y="410" 
        font-family="'Noto Sans Tamil', 'Tamil MN', serif" 
        font-size="34" 
        font-weight="bold" 
        fill="#CC0000" 
        text-anchor="middle"
        letter-spacing="1">தமிழக வெற்றிக் கழகம்</text>

  <!-- Subtitle text -->
  <text x="200" y="448" 
        font-family="'Noto Sans Tamil', 'Tamil MN', serif" 
        font-size="16" 
        fill="#FFD700" 
        text-anchor="middle">பிறப்பொக்கும் எல்லா உயிர்க்கும்!</text>
</svg>
